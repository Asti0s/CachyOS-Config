# ==========================================================================
# FONTS (P10K's MesloLGS NF Optimized)
# ==========================================================================
font_family      MesloLGS NF
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size        8

modify_font cell_height  6px
modify_font cell_width   0px

bold_font_weight regular


# ==========================================================================
# CURSOR & MOUSE
# ==========================================================================
cursor_shape     beam
cursor_beam_thickness 1.5
cursor_blink_interval -1
cursor_stop_blinking_after 15.0

# Mouse hide on type
mouse_hide_wait  3.0
url_style        curly


# ==========================================================================
# WINDOW & TRANSPARENCY
# ==========================================================================
background_opacity         0.85
background_blur            20

window_padding_width       12
single_window_margin_width 0

hide_window_decorations    no

window_border_width        1pt


# ==========================================================================
# TAB BAR DESIGN
# ==========================================================================
tab_bar_style              powerline
tab_powerline_style        slanted
tab_activity_symbol        "🔔 "


# ==========================================================================
# ADVANCED & PERFORMANCE
# ==========================================================================
# Performance tuning for buttery smooth scrolling
repaint_delay              10
input_delay                3
sync_to_monitor            yes

# Disable annoying audio bell
enable_audio_bell          no

# Remember previous window size upon opening
remember_window_size       yes
initial_window_width       800
initial_window_height      500


# ==========================================================================
# KEYBINDINGS & SHORTCUTS
# ==========================================================================
# Clear default mappings if needed, or add custom ones:
# Open new window/tab in current working directory
map ctrl+shift+enter    new_window_with_cwd
map ctrl+shift+t        new_tab_with_cwd

# Quick window navigation (Alt + Arrow keys)
map alt+left             neighboring_window left
map alt+right            neighboring_window right
map alt+up               neighboring_window up
map alt+down             neighboring_window down

# Font size scaling shortcuts
map ctrl+shift+equal     change_font_size all +1.0
map ctrl+shift+minus     change_font_size all -1.0
map ctrl+shift+backspace change_font_size all 0


# BEGIN_KITTY_THEME
# Tokyo Night
include colors.conf
# END_KITTY_THEME
